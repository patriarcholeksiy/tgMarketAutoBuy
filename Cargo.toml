[package]
name = "tg_market_autobuy"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
anyhow = "1.0.102"
dotenvy = "0.15.7"
serde = "1"
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros", "signal"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "macros"] }
ferogram = { version = "0.6.0", features = ["serde"] }
wreq = { version = "6.0.0-rc.28", features = ["cookies", "json"] }
wreq-util = "3.0.0-rc.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
arc-swap = "1.9.1"
rustc-hash = "2.1.2"
envy = "0.4.2"
mimalloc = "0.1.52"
